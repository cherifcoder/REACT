<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1020" />
    <title>React Atelier — Apprendre React par la pratique</title>
    <meta
      name="description"
      content="Un parcours complet pour apprendre React par la pratique : 6 modules, 60 projets progressifs, 5 projets guidés et un projet final professionnel pas à pas."
    />
    <meta property="og:title" content="React Atelier — Apprendre React par la pratique" />
    <meta
      property="og:description"
      content="De l'installation de React à la réalisation d'un site professionnel complet. Modules détaillés, code, projets et tutoriels pas à pas."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('react-atelier-theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (error) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
